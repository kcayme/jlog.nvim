name: Generate Vimdoc

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/options.md
      - .github/workflows/vimdoc.yml
  workflow_dispatch:

jobs:
  vimdoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Concatenate documentation sources
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/options.md

          # Strip the H1 plugin-name line from README: panvimdoc uses the plugin
          # name as the doc title, so keeping it would produce double-prefix tags.
          # Also strip the demo <video>: it has no meaning in vimdoc.
          sed -e '/^# jlog\.nvim$/d' -e '/^<video /d' README.md > .doc-source.md
          printf "\n\n" >> .doc-source.md
          # Demote options.md so it nests under the README content.
          sed 's/^#/##/' docs/options.md >> .doc-source.md

      - name: Check for duplicate headings
        run: |
          set -euo pipefail
          dupes=$(grep -iE '^##? ' .doc-source.md \
            | tr '[:upper:]' '[:lower:]' \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "ERROR: duplicate H1 headings found (will produce duplicate vimdoc tags):"
            echo "$dupes"
            exit 1
          fi

      - uses: kdheepak/panvimdoc@662fb20304d20c539fb48a0bda628f5165507de7 # v4.0.1
        with:
          vimdoc: jlog.nvim
          pandoc: .doc-source.md

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1 (v7 tag)
        with:
          commit_message: "docs: generate vimdoc [skip ci]"
          file_pattern: doc/jlog.nvim.txt
          branch: main
